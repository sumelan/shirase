# tack pins edit by hand or with tack add / rm / alias
# nix reads pins.lock.json; this file drives tack update

# shorturl schemes. scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}" # github
cb = "git+https://codeberg.org/{path}" # codeberg
nixpkgs = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
private = "git+ssh://git@github.com/sumelan/{path}"

# all_follow: input name -> top-level pin it follows wherever it appears
# opt out per-input with exclude_follow
[all_follow]
# no deduplication
nixpkgs = ["nixpkgs", "nixpkgs-lib"]
hjem = "hjem"
flake-parts = "flake-parts"

# [inputs.<name>] fields
#   url             required, shorturl ok; ?rev=<sha> pins an exact commit
#   flake           default true; false exposes the source path
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules

[inputs]

[inputs.nixpkgs]
url = "nixpkgs:nixos-unstable"

[inputs.my-secrets]
url = "private:my-secrets"
type = "fetch"

[inputs.flake-parts]
url = "gh:hercules-ci/flake-parts"

[inputs.hjem]
url = "gh:feel-co/hjem"

[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"

[inputs.nvf]
url = "gh:notashelf/nvf"

[inputs.nixos-plymouth]
url = "gh:BeatLink/nixos-plymouth"

[inputs.swash]
url = "gh:ItsLemmy/swash"

[inputs.comview]
url = "gh:sumelan/comview/flake"

[inputs.inshellah]
url = "gh:manic-systems/inshellah"

[inputs.hl]
url = "gh:pamburus/hl"

[inputs.mangowm]
url = "gh:mangowm/mango"

[inputs.nix-secrets]
url = "gh:unnamed-systems/nix-secrets"

[inputs.preservation]
url = "gh:nix-community/preservation"

[inputs.kopuz]
url = "gh:temidaradev/kopuz"


